name: Detached review - real isolated clock-only dispatch proof
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: detached-review-clock-only-dispatch-proof
  cancel-in-progress: false
jobs:
  clock-only-proof:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'review/nov18-clock-only-actual-dispatch' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      OBSERVED_MODE: ${{ vars.TRAVNR_RELAY_MODE }}
      TARGET_SECRET_CONFIGURED: ${{ secrets.TRAVNR_TARGET_ACTIONS_TOKEN != '' }}
      DATABASE_URL: ''
      AERODATABOX_API_KEY: ''
      RAPIDAPI_KEY: ''
    steps:
      - name: Dispatch exactly one installed clock-only run and verify its receipt
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          const repo='HKcode22/TravnrClockRelay',pin='9cca29330405774520e0c7929f4916e24d9934e4';
          const wf='external-clock.yml',blob='9fcb3cafb28718384d501f8f9248b90746196415';
          const root='https://api.github.com/repos/'+repo,token=process.env.GH_TOKEN;
          const hold=s=>{throw Error('HOLD_ISOLATED_CLOCK_'+s)};
          const headers={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const emit=x=>console.log(JSON.stringify(x));
          const num=x=>Number.isSafeInteger(x)&&x>0;
          async function get(p){
            const r=await fetch(root+p,{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(10000)});
            if(!r.ok)hold('READ_HTTP_'+r.status);
            return r.json();
          }
          async function main(){
            if(process.env.GITHUB_REPOSITORY!==repo||process.env.GITHUB_EVENT_NAME!=='pull_request'||
               process.env.GITHUB_RUN_ATTEMPT!=='1'||!token||token.length<16||
               !['','CLOCK_ONLY'].includes(process.env.OBSERVED_MODE??'')||
               process.env.TARGET_SECRET_CONFIGURED!=='false'||process.env.DATABASE_URL||
               process.env.AERODATABOX_API_KEY||process.env.RAPIDAPI_KEY)hold('SCOPE');
            if((await get('/git/ref/heads/main')).object?.sha!==pin)hold('PIN');
            const file=await get('/contents/.github/workflows/'+wf+'?ref='+pin);
            const w=await get('/actions/workflows/'+wf);
            if(file.sha!==blob||w.path!=='.github/workflows/'+wf||w.state!=='active')hold('WORKFLOW');
            // Never repeat the POST after an uncertain response.
            emit({status:'ISOLATED_CLOCK_ONLY_ATTEMPT_NO_REPLAY',reviewedRelaySha:pin});
            const started=Date.now();
            const res=await fetch(root+'/actions/workflows/'+wf+'/dispatches',{
              method:'POST',headers:{...headers,'Content-Type':'application/json'},redirect:'error',
              signal:AbortSignal.timeout(10000),body:JSON.stringify({ref:'main',return_run_details:true})
            });
            if(res.status!==200)hold('ACK_HTTP_'+res.status+'_NO_REPLAY');
            const ack=await res.json(),id=ack.workflow_run_id;
            if(!num(id)||ack.run_url!==root+'/actions/runs/'+id||
               ack.html_url!=='https://github.com/'+repo+'/actions/runs/'+id)hold('ACK_UNKNOWN_NO_REPLAY');
            emit({status:'ISOLATED_CLOCK_ONLY_ACK_NOT_EXECUTION_PROOF',runId:id});
            let row;
            for(let i=0;i<36;i++){
              row=await get('/actions/runs/'+id);
              if(row.id!==id||row.head_sha!==pin||row.path!=='.github/workflows/'+wf||
                 row.event!=='workflow_dispatch'||row.head_branch!=='main'||row.run_attempt!==1)hold('RUN_IDENTITY');
              if(row.status==='completed')break;
              await sleep(5000);
            }
            if(row?.status!=='completed'||row.conclusion!=='success')hold('RUN_NOT_SUCCESS_NO_REPLAY');
            const q=await get('/actions/runs/'+id+'/jobs?filter=latest&per_page=100');
            const js=q.jobs?.filter(j=>j.name==='independent-pulse')??[];
            if(q.total_count!==q.jobs?.length||js.length!==1)hold('JOB_IDENTITY');
            const j=js[0];
            if(!num(j.id)||j.run_id!==id||j.head_sha!==pin||j.run_attempt!==1||j.status!=='completed'||
               j.conclusion!=='success'||j.steps?.filter(s=>s.name==='Run node cli.mjs'&&s.status==='completed'&&s.conclusion==='success').length!==1)
              hold('JOB_STEP');
            let log;
            try{log=execFileSync('gh',['run','view',String(id),'-R',repo,'--job',String(j.id),'--log'],
              {encoding:'utf8',timeout:30000,maxBuffer:2*1024*1024,stdio:['ignore','pipe','ignore']});}
            catch{hold('LOG_UNAVAILABLE');}
            const rows=log.split(/\r?\n/).flatMap(l=>{
              const p=l.indexOf('{"status":"EXTERNAL_CLOCK_OBSERVED_NO_TARGET_DISPATCH"');
              if(p<0)return [];
              try{return [JSON.parse(l.slice(p).trim())]}catch{hold('RECEIPT_JSON')}
            });
            if(rows.length!==1)hold('RECEIPT_COUNT');
            const x=rows[0],created=Date.parse(row.created_at),observed=Date.parse(x.runnerObservedUtc);
            if(x.relayRunId!==id||x.mode!=='CLOCK_ONLY'||Date.parse(x.actualCreatedUtc)!==created||
               x.providerCallsByRelay!==0||x.databaseReadsByRelay!==0||x.databaseWritesByRelay!==0||x.paidAuthorityGranted!==false||
               !Number.isFinite(observed)||!Number.isSafeInteger(x.creationToObservedMs)||
               x.creationToObservedMs<0||Math.abs(observed-created-x.creationToObservedMs)>1000||
               observed> Date.now()+1000||observed<Date.parse(j.started_at)-5000||
               observed>Date.parse(j.completed_at)+1000||created<started-5000)hold('RECEIPT_SCOPE');
            if((await get('/git/ref/heads/main')).object?.sha!==pin)hold('PIN_DRIFT');
            emit({status:'ACTUAL_INSTALLED_RELAY_CLOCK_ONLY_PROVEN_NOT_CRON_SERVICE_PROOF',runId:id,jobId:j.id,
              relayMain:pin,creationToRunnerMs:x.creationToObservedMs,requestToRunnerMs:observed-started,
              providerCalls:0,databaseReads:0,databaseWrites:0,targetDispatches:0,paidAuthorityGranted:false});
          }
          try{await main()}catch(e){console.error(/^HOLD_ISOLATED_CLOCK_[A-Z0-9_]+$/.test(e?.message||'')?e.message:'HOLD_ISOLATED_CLOCK_UNKNOWN_NO_REPLAY');process.exitCode=2;}
          NODE
