name: One-shot review request - disabled backup pair
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: nov18-disabled-pair-request-once
  cancel-in-progress: false
jobs:
  request-protected-work:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'HKcode22' &&
      github.head_ref == 'review/nov18-request-disabled-recovery-pair' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Request one owner-approved disabled pair operation (no Cron secrets here)
        run: |
          node --input-type=module <<'NODE'
          const repo="HKcode22/TravnrClockRelay",pin="fc7e87f6d86e52394b0c19e5ac99c8c4b9aaaff0",blob="a93e754144512600c0f72ffe667666247c1af15c";
          const root="https://api.github.com/repos/"+repo,wf="cron-admin.yml";
          const headers={Authorization:"Bearer "+process.env.GITHUB_TOKEN,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
          const hold=s=>{throw Error("HOLD_DISABLED_PAIR_REQUEST_"+s)};
          const emit=x=>console.log(JSON.stringify(x));
          async function get(path){
            const r=await fetch(root+path,{method:"GET",headers,redirect:"error",signal:AbortSignal.timeout(10000)});
            if(!r.ok)hold("READ_HTTP_"+r.status);return r.json();
          }
          async function go(){
            if(process.env.GITHUB_REPOSITORY!==repo||process.env.GITHUB_EVENT_NAME!=="pull_request"||process.env.GITHUB_RUN_ATTEMPT!=="1")hold("SCOPE");
            const stable=async()=>{if((await get("/git/ref/heads/main")).object?.sha!==pin)hold("MAIN_DRIFT")};
            await stable();
            if((await get("/contents/.github/workflows/"+wf+"?ref="+pin)).sha!==blob)hold("WORKFLOW_BLOB");
            const history=await get("/actions/workflows/"+wf+"/runs?branch=main&event=workflow_dispatch&per_page=100");
            if(history.total_count!==0||!Array.isArray(history.workflow_runs)||history.workflow_runs.length!==0)hold("PRIOR_MANAGEMENT_REQUEST_INSPECT");
            await stable();
            emit({status:"ONE_DISABLED_PAIR_REQUEST_ATTEMPT_NO_REPLAY",relayMain:pin});
            const r=await fetch(root+"/actions/workflows/"+wf+"/dispatches",{method:"POST",headers:{...headers,"Content-Type":"application/json"},redirect:"error",signal:AbortSignal.timeout(10000),body:JSON.stringify({ref:"main",return_run_details:true,inputs:{operation:"CREATE_DISABLED_PAIR",lane:"RECOVERY_PAIR",job_id:"",expires_utc:"2026-12-19T08:00:00.000Z",approved_relay_main_sha:pin,confirm:"CREATE_BOTH_RECOVERY_CRON_JOBS_DISABLED_NO_FORWARD"}})});
            if(r.status!==200)hold("ACK_HTTP_"+r.status+"_NO_REPLAY");
            const a=await r.json(),n=a.workflow_run_id;
            if(!Number.isSafeInteger(n)||n<1||a.run_url!==root+"/actions/runs/"+n||a.html_url!=="https://github.com/"+repo+"/actions/runs/"+n)hold("UNKNOWN_ACK_NO_REPLAY");
            emit({status:"PROTECTED_DISABLED_PAIR_REQUEST_ACK_NOT_PROVISIONED",runId:n,reviewRequired:true,url:a.html_url});
            const run=await get("/actions/runs/"+n);
            if(run.id!==n||run.head_sha!==pin||run.head_branch!=="main"||run.path!==".github/workflows/"+wf||run.event!=="workflow_dispatch"||run.run_attempt!==1)hold("RUN_IDENTITY");
            emit({status:"EXACT_PROTECTED_REQUEST_IDENTITY_VERIFIED",runId:n,runStatus:run.status,relayMain:pin,cronWritesByRequester:0,providerCalls:0,dbWrites:0,targetDispatches:0});
          }
          try{await go()}catch(e){console.error(/^HOLD_DISABLED_PAIR_REQUEST_[A-Z0-9_]+$/.test(e.message)?e.message:"HOLD_DISABLED_PAIR_REQUEST_UNKNOWN_INSPECT_NO_REPLAY");process.exitCode=2}
          NODE
