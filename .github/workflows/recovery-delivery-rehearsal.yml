name: Recovery delivery rehearsal (one nonpaid OBSERVE only)
on:
  pull_request:
    branches: [main]
    paths: ['target-rehearsal.mjs','target-rehearsal.test.mjs','.github/workflows/recovery-delivery-rehearsal.yml']
  workflow_dispatch:
    inputs:
      approved_relay_sha:
        type: string
        required: true
      approved_target_sha:
        type: string
        required: true
      confirm:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: cross-repo-observe-rehearsal-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  offline-rehearsal-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check target-rehearsal.mjs && node --test target-rehearsal.test.mjs
  protected-single-target-observation:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.approved_relay_sha == github.sha &&
      inputs.approved_target_sha == '45d04392e2eecfc1220230f252d2ada8cc6137e0' &&
      inputs.confirm == 'ONE_CROSS_REPO_OBSERVE_ONLY_NO_PROVIDER_NO_DB'
    environment: travnr-target-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Dispatch exact existing OBSERVE canary then independently verify terminal receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAVNR_TARGET_ACTIONS_TOKEN: ${{ secrets.TRAVNR_TARGET_ACTIONS_TOKEN }}
          TRAVNR_REHEARSAL_RELAY_PIN: ${{ inputs.approved_relay_sha }}
          TRAVNR_REHEARSAL_TARGET_PIN: ${{ inputs.approved_target_sha }}
          TRAVNR_REHEARSAL_CONFIRM: ${{ inputs.confirm }}
          TRAVNR_CRON_ACCOUNT_KEY: ''
          TRAVNR_CRON_RELAY_TOKEN: ''
          DATABASE_URL: ''
          RAPIDAPI_KEY: ''
          AERODATABOX_API_KEY: ''
        run: node target-rehearsal.mjs
