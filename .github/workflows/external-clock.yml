name: Travnr external clock relay (isolated)
run-name: ${{ github.event_name == 'workflow_dispatch' && format('TRAVNR EXTERNAL CLOCK {0}', inputs.lane) || 'Travnr relay tests' }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['relay.mjs','relay.test.mjs','cli.mjs','.github/workflows/external-clock.yml']
  workflow_dispatch:
    inputs:
      lane:
        type: choice
        options: [CLOCK_ONLY, PRIMARY_BACKSTOP, ROLLING_ROOT]
        default: CLOCK_ONLY
permissions:
  contents: read
  actions: read
concurrency:
  group: travnr-external-clock-${{ github.event_name }}-${{ inputs.lane || 'CLOCK_ONLY' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'singleton' }}
  cancel-in-progress: false
jobs:
  offline-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test relay.test.mjs
  independent-pulse:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && (inputs.lane == 'CLOCK_ONLY' || (vars.TRAVNR_RELAY_MODE == 'CLOCK_ONLY' && vars.TRAVNR_RELAY_PRIMARY_ENABLED != '1' && vars.TRAVNR_RELAY_ROLLING_ENABLED != '1' && vars.TRAVNR_EXTERNAL_LANE_COMMISSION_APPROVED != '1' && (inputs.lane == 'PRIMARY_BACKSTOP' || inputs.lane == 'ROLLING_ROOT')))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node cli.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAVNR_RELAY_MODE: ${{ inputs.lane == 'CLOCK_ONLY' && 'CLOCK_ONLY' || 'SHADOW_PAIR' }}
          TRAVNR_RELAY_LANE: ${{ inputs.lane }}
          TRAVNR_TARGET_ACTIONS_TOKEN: ''
          DATABASE_URL: ''
          AERODATABOX_API_KEY: ''
          AERODATABOX_WEBHOOK_SECRET: ''
          RAPIDAPI_KEY: ''
  target-forward:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && vars.TRAVNR_RELAY_MODE == 'MULTI_LANE' &&
      ((inputs.lane == 'PRIMARY_BACKSTOP' && vars.TRAVNR_RELAY_PRIMARY_ENABLED == '1') ||
      (inputs.lane == 'ROLLING_ROOT' && vars.TRAVNR_RELAY_ROLLING_ENABLED == '1' && vars.TRAVNR_RELAY_ROLLING_ROUTE != 'ISOLATED_CONTROLLER'))
    environment: travnr-target-forward
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node cli.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAVNR_RELAY_MODE: MULTI_LANE
          TRAVNR_RELAY_LANE: ${{ inputs.lane }}
          TRAVNR_RELAY_PRIMARY_ENABLED: ${{ vars.TRAVNR_RELAY_PRIMARY_ENABLED }}
          TRAVNR_RELAY_ROLLING_ENABLED: ${{ vars.TRAVNR_RELAY_ROLLING_ENABLED }}
          TRAVNR_RELAY_PRIMARY_SINCE_UTC: ${{ vars.TRAVNR_RELAY_PRIMARY_SINCE_UTC }}
          TRAVNR_RELAY_PRIMARY_VERIFY_RUN_ID: ${{ vars.TRAVNR_RELAY_PRIMARY_VERIFY_RUN_ID }}
          TRAVNR_RELAY_FULL_RETENTION_APPROVED: ${{ vars.TRAVNR_RELAY_FULL_RETENTION_APPROVED }}
          TRAVNR_RELAY_ROLLING_SINCE_UTC: ${{ vars.TRAVNR_RELAY_ROLLING_SINCE_UTC }}
          TRAVNR_RELAY_ROLLING_ROUTE: ${{ vars.TRAVNR_RELAY_ROLLING_ROUTE }}
          TRAVNR_RELAY_DIRECT_TICK_APPROVED: ${{ vars.TRAVNR_RELAY_DIRECT_TICK_APPROVED }}
          TRAVNR_APPROVED_TARGET_MAIN_SHA: ${{ vars.TRAVNR_APPROVED_TARGET_MAIN_SHA }}
          TRAVNR_ROLLING_POLICY_FROM_UTC: ${{ vars.TRAVNR_ROLLING_POLICY_FROM_UTC }}
          TRAVNR_ROLLING_POLICY_UNTIL_UTC: ${{ vars.TRAVNR_ROLLING_POLICY_UNTIL_UTC }}
          TRAVNR_ROLLING_FOUR_APPROVED: ${{ vars.TRAVNR_ROLLING_FOUR_APPROVED }}
          TRAVNR_TARGET_ACTIONS_TOKEN: ${{ secrets.TRAVNR_TARGET_ACTIONS_TOKEN }}
          TRAVNR_TARGET_FORWARD_ENV_READY: ${{ vars.TRAVNR_TARGET_FORWARD_ENV_READY }}
          DATABASE_URL: ''
          AERODATABOX_API_KEY: ''
          AERODATABOX_WEBHOOK_SECRET: ''
          RAPIDAPI_KEY: ''
  isolated-controller-forward:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && inputs.lane == 'ROLLING_ROOT' &&
      vars.TRAVNR_RELAY_MODE == 'MULTI_LANE' &&
      vars.TRAVNR_RELAY_ROLLING_ENABLED == '1' &&
      vars.TRAVNR_RELAY_ROLLING_ROUTE == 'ISOLATED_CONTROLLER' &&
      vars.P6_RELAY_ISOLATED_CONTROLLER_ENABLED == '1' &&
      vars.P6_RELAY_APPROVED_EXECUTABLE_SHA == github.sha
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Forward one exact isolated controller wake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAVNR_RELAY_ROLLING_ROUTE: ${{ vars.TRAVNR_RELAY_ROLLING_ROUTE }}
          TRAVNR_RELAY_ROLLING_ENABLED: ${{ vars.TRAVNR_RELAY_ROLLING_ENABLED }}
          TRAVNR_RELAY_ROLLING_SINCE_UTC: ${{ vars.TRAVNR_RELAY_ROLLING_SINCE_UTC }}
          P6_RELAY_ISOLATED_CONTROLLER_ENABLED: ${{ vars.P6_RELAY_ISOLATED_CONTROLLER_ENABLED }}
          P6_RELAY_APPROVED_EXECUTABLE_SHA: ${{ vars.P6_RELAY_APPROVED_EXECUTABLE_SHA }}
          P6_ISOLATED_FORWARD_ENTRYPOINT: '1'
        run: node isolated/forward.mjs
