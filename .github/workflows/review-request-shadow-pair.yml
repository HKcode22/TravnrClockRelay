name: One-shot protected request - existing shadow pair
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
  actions: write
concurrency:
  group: nov18-shadow-pair-one-request
  cancel-in-progress: false
jobs:
  request:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'HKcode22' &&
      github.head_ref == 'review/nov18-request-shadow-pair' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Request one protected nonforwarding pair activation
        run: |
          node --input-type=module <<'NODE'
          const repo="HKcode22/TravnrClockRelay",pin="ed35a5467dda0afc75eda386ad43ee4f401b23c4",blob="902e9844f68fc04db5b21504661dc8b0c0691858";
          const api="https://api.github.com/repos/"+repo,wf="cron-admin.yml",headers={Authorization:"Bearer "+process.env.GITHUB_TOKEN,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
          const fail=s=>{throw Error("HOLD_SHADOW_REQUEST_"+s)};
          async function get(path){
            const r=await fetch(api+path,{method:"GET",headers,redirect:"error",signal:AbortSignal.timeout(10000)});
            if(!r.ok)fail("HTTP_"+r.status);return r.json();
          }
          async function main(){
            const stable=async()=>{if((await get("/git/ref/heads/main")).object?.sha!==pin)fail("MAIN_DRIFT")};
            if(process.env.GITHUB_REPOSITORY!==repo||process.env.GITHUB_EVENT_NAME!=="pull_request"||process.env.GITHUB_RUN_ATTEMPT!=="1")fail("SCOPE");
            await stable();
            if((await get("/contents/.github/workflows/"+wf+"?ref="+pin)).sha!==blob)fail("WORKFLOW_BLOB");
            const a=await get("/actions/workflows/"+wf+"/runs?branch=main&event=workflow_dispatch&per_page=100");
            if(a.total_count!==1||a.workflow_runs?.length!==1||a.workflow_runs[0]?.id!==44271000588||a.workflow_runs[0]?.conclusion!=="success"||a.workflow_runs[0]?.status!=="completed")fail("PRIOR_MANAGEMENT_INSPECT");
            await stable();
            console.log(JSON.stringify({status:"ONE_SHADOW_PAIR_REQUEST_ATTEMPT_NO_REPLAY",relayPin:pin}));
            const r=await fetch(api+"/actions/workflows/"+wf+"/dispatches",{method:"POST",headers:{...headers,"Content-Type":"application/json"},redirect:"error",signal:AbortSignal.timeout(10000),body:JSON.stringify({ref:"main",return_run_details:true,inputs:{operation:"ENABLE_SHADOW_PAIR",lane:"RECOVERY_PAIR",job_id:"",expires_utc:"2026-12-19T08:00:00.000Z",prior_expires_utc:"",approved_relay_main_sha:pin,confirm:"ENABLE_EXACT_EXISTING_PAIR_SHADOW_NO_FORWARD"}})});
            if(r.status!==200)fail("ACK_HTTP_"+r.status+"_NO_REPLAY");
            const q=await r.json(),id=q.workflow_run_id;
            if(!Number.isSafeInteger(id)||id<1||q.run_url!==api+"/actions/runs/"+id||q.html_url!=="https://github.com/"+repo+"/actions/runs/"+id)fail("UNKNOWN_ACK_NO_REPLAY");
            console.log(JSON.stringify({status:"PROTECTED_SHADOW_PAIR_REQUEST_ACK_NOT_ACTIVATED",runId:id,url:q.html_url,cronWritesByRequester:0,providerCalls:0,databaseWrites:0,targetDispatches:0}));
            const v=await get("/actions/runs/"+id);
            if(v.head_sha!==pin||v.id!==id||v.head_branch!=="main"||v.event!=="workflow_dispatch"||v.run_attempt!==1||v.path!==".github/workflows/"+wf)fail("RUN_IDENTITY");
            console.log(JSON.stringify({status:"EXACT_SHADOW_REQUEST_IDENTITY_VERIFIED",runId:id,runStatus:v.status}));
          }
          try{await main()}catch(e){console.error(/^HOLD_SHADOW_REQUEST_[A-Z0-9_]+$/.test(e.message)?e.message:"HOLD_SHADOW_REQUEST_REDACTED_INSPECT_NO_REPLAY");process.exitCode=2}
          NODE
