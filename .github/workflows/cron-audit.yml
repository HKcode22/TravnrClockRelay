name: Managed cron clock audit (read-only)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['cron-audit.mjs', 'cron-audit.test.mjs', '.github/workflows/cron-audit.yml']
  push:
    branches: [main]
    paths: ['cron-audit.mjs', '.github/workflows/cron-audit.yml']
  schedule:
    - cron: '43 */2 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: managed-cron-audit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false
jobs:
  tests-no-secret:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check cron-audit.mjs && node --test cron-audit.test.mjs
      - name: Read actual isolated relay metadata WITHOUT Cron credentials or dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const repo="HKcode22/TravnrClockRelay";
          const root="https://api.github.com/repos/"+repo;
          try{
            const r=await fetch(root+"/actions/workflows/external-clock.yml/runs?branch=main&event=workflow_dispatch&per_page=100&created="+encodeURIComponent(">="+new Date(Date.now()-3*3600000).toISOString()),{headers:{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},redirect:"error",signal:AbortSignal.timeout(10000)});
            if(!r.ok)throw Error("HTTP_"+r.status);
            const q=await r.json();
            if(!Number.isSafeInteger(q.total_count)||q.total_count>100||q.workflow_runs?.length!==q.total_count)throw Error("HISTORY");
            const rows=q.workflow_runs.map(x=>{
              if(x.path!==".github/workflows/external-clock.yml"||x.head_branch!=="main"||x.event!=="workflow_dispatch"||!Number.isSafeInteger(x.id)||x.run_attempt!==1)throw Error("IDENTITY");
              return {runId:x.id,createdUtc:x.created_at,head:x.head_sha,status:x.status,conclusion:x.conclusion};
            });
            console.log(JSON.stringify({status:"ACTUAL_RELAY_HISTORY_NOT_EXTERNAL_ATTRIBUTION_PROOF",rows,providerCalls:0,dispatches:0}));
          }catch(e){console.error("HOLD_ACTUAL_RELAY_HISTORY");process.exitCode=2}
          NODE
  readonly-cron-audit:
    if: >-
      github.repository == 'HKcode22/TravnrClockRelay' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      (github.event_name == 'push' && github.event.before == '9cca29330405774520e0c7929f4916e24d9934e4' &&
       vars.TRAVNR_CRON_PILOT_AUDIT_AFTER_MERGE == '1' ||
      ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (vars.TRAVNR_CRON_AUDIT_ENABLED == '1' || (vars.TRAVNR_RELAY_MODE == 'CLOCK_ONLY' && vars.TRAVNR_RELAY_PRIMARY_ENABLED != '1' && vars.TRAVNR_RELAY_ROLLING_ENABLED != '1' && vars.TRAVNR_EXTERNAL_LANE_COMMISSION_APPROVED != '1'))))
    environment: travnr-cron-audit
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Audit exact approved clock configuration and sanitized evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAVNR_CRON_ACCOUNT_KEY: ${{ secrets.TRAVNR_CRON_ACCOUNT_KEY }}
          TRAVNR_CRON_AUDIT_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (vars.TRAVNR_RELAY_MODE == 'CLOCK_ONLY' && 'SHADOW_RECENT' || 'RECENT') || 'PILOT' }}
          TRAVNR_RELAY_MODE: ${{ vars.TRAVNR_RELAY_MODE }}
          TRAVNR_RELAY_PRIMARY_ENABLED: ${{ vars.TRAVNR_RELAY_PRIMARY_ENABLED }}
          TRAVNR_RELAY_ROLLING_ENABLED: ${{ vars.TRAVNR_RELAY_ROLLING_ENABLED }}
          TRAVNR_EXTERNAL_LANE_COMMISSION_APPROVED: ${{ vars.TRAVNR_EXTERNAL_LANE_COMMISSION_APPROVED }}
          TRAVNR_CRON_PREVIOUS_RELAY_SHA: ${{ github.event.before }}
          TRAVNR_CRON_JOB_ID: ${{ vars.TRAVNR_CRON_JOB_ID }}
          TRAVNR_CRON_RELAY_SHA: ${{ vars.TRAVNR_CRON_RELAY_SHA }}
          TRAVNR_CRON_START_UTC: ${{ vars.TRAVNR_CRON_START_UTC }}
          TRAVNR_CRON_ENABLED_UTC: ${{ vars.TRAVNR_CRON_ENABLED_UTC }}
          TRAVNR_CRON_UNTIL_UTC: ${{ vars.TRAVNR_CRON_UNTIL_UTC }}
          TRAVNR_CRON_AUDIT_LAYOUT: ${{ vars.TRAVNR_CRON_AUDIT_LAYOUT }}
          TRAVNR_CRON_PRIMARY_JOB_ID: ${{ vars.TRAVNR_CRON_PRIMARY_JOB_ID }}
          TRAVNR_CRON_PRIMARY_START_UTC: ${{ vars.TRAVNR_CRON_PRIMARY_START_UTC }}
          TRAVNR_CRON_PRIMARY_ENABLED_UTC: ${{ vars.TRAVNR_CRON_PRIMARY_ENABLED_UTC }}
          TRAVNR_CRON_PRIMARY_UNTIL_UTC: ${{ vars.TRAVNR_CRON_PRIMARY_UNTIL_UTC }}
          TRAVNR_CRON_ROLLING_JOB_ID: ${{ vars.TRAVNR_CRON_ROLLING_JOB_ID }}
          TRAVNR_CRON_ROLLING_START_UTC: ${{ vars.TRAVNR_CRON_ROLLING_START_UTC }}
          TRAVNR_CRON_ROLLING_ENABLED_UTC: ${{ vars.TRAVNR_CRON_ROLLING_ENABLED_UTC }}
          TRAVNR_CRON_ROLLING_UNTIL_UTC: ${{ vars.TRAVNR_CRON_ROLLING_UNTIL_UTC }}
          TRAVNR_APPROVED_TARGET_MAIN_SHA: ${{ vars.TRAVNR_APPROVED_TARGET_MAIN_SHA }}
          TRAVNR_LEASE_CONTINUITY_ARMED: ${{ vars.TRAVNR_LEASE_CONTINUITY_ARMED }}
          TRAVNR_LEASE_ENV_READY: ${{ vars.TRAVNR_LEASE_ENV_READY }}
          TRAVNR_TARGET_ACTIONS_TOKEN: ''
          DATABASE_URL: ''
          AERODATABOX_API_KEY: ''
          RAPIDAPI_KEY: ''
        run: node cron-audit.mjs
